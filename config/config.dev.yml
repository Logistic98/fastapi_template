app:
  host: 0.0.0.0
  port: 18000
  workers: 1
  reload: true

llm:
  base_url: https://api.siliconflow.cn/v1
  model: deepseek-ai/DeepSeek-V3
  api_key: sk-xxx
  timeout_seconds: 60

auth:
  enabled: true
  keys:
    - sk-11111111111111111111111111111111
    - sk-22222222222222222222222222222222

logging:
  level: INFO
  console: true
  file: true
  file_path: logs/app.log
  format: "%(asctime)s %(levelname)s %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  stream: stdout